<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDD Remote Desktop</title>
    <style>
      :root {
        --bg: #111;
        --fg: #eee;
        --panel: #1c1c1e;
        --panel-border: #333;
        --accent: #3a82f7;
        --muted: #9a9a9e;
        --danger: #e5484d;
        --ok: #3fb950;
      }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none;
      }
      /* ネイティブアプリ感: テキスト選択/コールアウト/ドラッグを無効化。入力欄のみ選択可。 */
      * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
      input, textarea { user-select: text; -webkit-user-select: text; }
      button { font: inherit; }

      /* --- 全面 canvas (最背面) --- */
      #screen-wrap {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      #screen { max-width: 100%; max-height: 100%; background: #000; outline: none; }

      /* --- 自動格納ツールバー (RDP/RustDesk 風) --- */
      /* マウスを上端へ持っていく / Ctrl+Alt+Shift+B で表示。ピンで常時表示。 */
      #topbar-hotzone { position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 20; }
      #topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 30;
        display: flex; gap: 8px; align-items: center;
        padding: 6px 10px;
        background: rgba(28, 28, 30, 0.96);
        border-bottom: 1px solid var(--panel-border);
        transform: translateY(-100%);
        transition: transform 0.18s ease;
      }
      #topbar.visible { transform: translateY(0); }
      #topbar button, #topbar select {
        background: #2c2c2e; color: var(--fg);
        border: 1px solid var(--panel-border); border-radius: 6px;
        padding: 4px 10px; cursor: pointer;
      }
      #topbar button:hover { background: #3a3a3c; }
      #topbar button.danger { border-color: var(--danger); color: #ff8a8d; }
      #topbar button.toggled { background: var(--accent); border-color: var(--accent); color: #fff; }
      #topbar .spacer { margin-left: auto; }
      #conn-label { font-family: monospace; font-size: 12px; color: var(--muted); }
      #display-wrap { display: none; align-items: center; gap: 4px; font-size: 12px; }

      /* --- 統計 HUD (Parsec/Moonlight 風) 右上、既定オフ --- */
      #stats-hud {
        position: fixed; top: 8px; right: 8px; z-index: 25;
        display: none;
        padding: 6px 10px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-family: monospace; font-size: 12px; line-height: 1.5;
        color: #d8d8d8; pointer-events: none;
        white-space: pre;
      }
      #stats-hud.visible { display: block; }

      /* --- トースト (一時通知) 右下スタック --- */
      #toast-container {
        position: fixed; bottom: 12px; right: 12px; z-index: 40;
        display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        pointer-events: none;
      }
      .toast {
        padding: 8px 14px; border-radius: 8px; max-width: 360px;
        background: rgba(40, 40, 44, 0.96); color: var(--fg);
        border: 1px solid var(--panel-border); font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.error { border-color: var(--danger); }
      .toast.success { border-color: var(--ok); }

      /* --- ファイル転送ポップオーバー (AnyDesk 風グルーピング) --- */
      #file-panel {
        position: fixed; top: 46px; right: 10px; z-index: 35;
        display: none; flex-direction: column; gap: 8px;
        padding: 12px; border-radius: 10px; width: 300px;
        background: var(--panel); border: 1px solid var(--panel-border);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      #file-panel.visible { display: flex; }
      #file-panel .row { display: flex; gap: 6px; align-items: center; }
      #file-panel .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      #file-panel input[type="text"], #file-panel input[type="file"] { flex: 1; min-width: 0; }
      #file-panel input { background: #2c2c2e; color: var(--fg); border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 6px; }
      #file-panel button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      #file-panel button:disabled { opacity: 0.5; cursor: default; }
      #file-panel .progress { font-family: monospace; font-size: 11px; color: var(--muted); min-width: 64px; text-align: right; }

      /* --- 接続オーバーレイ (中央カード、未接続時のみ) --- */
      #connect-overlay {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 8, 10, 0.82); backdrop-filter: blur(3px);
      }
      #connect-overlay.hidden { display: none; }
      #connect-card {
        width: 340px; padding: 24px;
        background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        display: flex; flex-direction: column; gap: 14px;
      }
      #connect-card h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
      #connect-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
      #connect-card input {
        background: #2c2c2e; color: var(--fg);
        border: 1px solid var(--panel-border); border-radius: 8px;
        padding: 8px 10px; font-size: 14px;
      }
      #connect-card input:focus { outline: none; border-color: var(--accent); }
      #connect-card button[type="submit"] {
        margin-top: 4px; padding: 10px; border: none; border-radius: 8px;
        background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      #connect-card button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
      #connect-status { min-height: 16px; font-size: 12px; font-family: monospace; color: var(--muted); }
      #connect-status.error { color: #ff8a8d; }
    </style>
  </head>
  <body>
    <!-- 最背面: リモート映像 -->
    <div id="screen-wrap">
      <canvas id="screen" tabindex="0" width="1920" height="1080"></canvas>
    </div>

    <!-- 接続中のオーバーレイ UI (TS が中身を構築) -->
    <div id="topbar-hotzone"></div>
    <div id="topbar"></div>
    <div id="stats-hud"></div>
    <div id="file-panel"></div>
    <div id="toast-container"></div>

    <!-- 未接続時の中央カード (TS が中身を構築) -->
    <div id="connect-overlay"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
