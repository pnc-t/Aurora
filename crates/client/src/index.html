<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDD Remote Desktop</title>
    <style>
      :root {
        --bg: #111;
        --fg: #eee;
        --panel: #1c1c1e;
        --panel-border: #333;
        --accent: #3a82f7;
        --muted: #9a9a9e;
        --danger: #e5484d;
        --ok: #3fb950;
      }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none;
      }
      /* ネイティブアプリ感: テキスト選択/コールアウト/ドラッグを無効化。入力欄のみ選択可。 */
      * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
      input, textarea { user-select: text; -webkit-user-select: text; }
      button { font: inherit; }

      /* --- 全面 canvas (最背面) --- */
      #screen-wrap {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      #screen { max-width: 100%; max-height: 100%; background: #000; outline: none; }

      /* --- 自動格納ツールバー (RDP/RustDesk 風) --- */
      /* マウスを上端へ持っていく / Ctrl+Alt+Shift+B で表示。ピンで常時表示。 */
      #topbar-hotzone { position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 20; }
      #topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 30;
        display: flex; gap: 8px; align-items: center;
        padding: 6px 10px;
        background: rgba(28, 28, 30, 0.96);
        border-bottom: 1px solid var(--panel-border);
        transform: translateY(-100%);
        transition: transform 0.18s ease;
      }
      #topbar.visible { transform: translateY(0); }
      #topbar button, #topbar select {
        background: #2c2c2e; color: var(--fg);
        border: 1px solid var(--panel-border); border-radius: 6px;
        padding: 4px 10px; cursor: pointer;
      }
      #topbar button:hover { background: #3a3a3c; }
      #topbar button.danger { border-color: var(--danger); color: #ff8a8d; }
      #topbar button.toggled { background: var(--accent); border-color: var(--accent); color: #fff; }
      #topbar .spacer { margin-left: auto; }
      /* ツールバー右端のウィンドウ操作 (フレームレス用)。通常ボタン装飾を打ち消す。 */
      #topbar .window-controls { display: flex; margin-left: 6px; }
      #topbar .winctl {
        width: 38px; height: 28px; padding: 0; border: none; border-radius: 0;
        background: transparent; color: var(--muted);
      }
      #topbar .winctl:hover { background: rgba(255, 255, 255, 0.1); color: var(--fg); }
      #topbar .winctl.close:hover { background: var(--danger); color: #fff; }
      #conn-label { font-family: monospace; font-size: 12px; color: var(--muted); }
      #display-wrap { display: none; align-items: center; gap: 4px; font-size: 12px; }

      /* --- 統計 HUD (Parsec/Moonlight 風) 右上、既定オフ --- */
      #stats-hud {
        position: fixed; top: 8px; right: 8px; z-index: 25;
        display: none;
        padding: 6px 10px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-family: monospace; font-size: 12px; line-height: 1.5;
        color: #d8d8d8; pointer-events: none;
        white-space: pre;
      }
      #stats-hud.visible { display: block; }

      /* --- トースト (一時通知) 右下スタック --- */
      #toast-container {
        position: fixed; bottom: 12px; right: 12px; z-index: 40;
        display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        pointer-events: none;
      }
      .toast {
        padding: 8px 14px; border-radius: 8px; max-width: 360px;
        background: rgba(40, 40, 44, 0.96); color: var(--fg);
        border: 1px solid var(--panel-border); font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.error { border-color: var(--danger); }
      .toast.success { border-color: var(--ok); }

      /* --- ファイル転送ポップオーバー (AnyDesk 風グルーピング) --- */
      #file-panel {
        position: fixed; top: 46px; right: 10px; z-index: 35;
        display: none; flex-direction: column; gap: 8px;
        padding: 12px; border-radius: 10px; width: 300px;
        background: var(--panel); border: 1px solid var(--panel-border);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      #file-panel.visible { display: flex; }
      #file-panel .row { display: flex; gap: 6px; align-items: center; }
      #file-panel .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      #file-panel input[type="text"], #file-panel input[type="file"] { flex: 1; min-width: 0; }
      #file-panel input { background: #2c2c2e; color: var(--fg); border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 6px; }
      #file-panel button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      #file-panel button:disabled { opacity: 0.5; cursor: default; }
      #file-panel .progress { font-family: monospace; font-size: 11px; color: var(--muted); min-width: 64px; text-align: right; }

      /* --- ランチャー (未接続時、サイドバー + ホスト一覧 / 設定) --- */
      #connect-overlay {
        position: fixed; inset: 0; z-index: 50;
        background: var(--bg);
      }
      #connect-overlay.hidden { display: none; }
      .launcher { display: flex; height: 100%; position: relative; }

      /* 自前タイトルバー (フレームレス): 上端のドラッグ領域 + 右上のウィンドウ操作 */
      .titlebar {
        position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 55;
      }
      .window-controls { position: absolute; top: 0; right: 0; display: flex; height: 34px; }
      .winctl {
        width: 44px; height: 34px; border: none; background: transparent; color: var(--muted);
        cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
      }
      .winctl:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
      .winctl.close:hover { background: var(--danger); color: #fff; }

      /* サイドバー (ブランドは非表示。上端はタイトルバー分あける) */
      .sidebar {
        width: 200px; flex-shrink: 0;
        display: flex; flex-direction: column;
        padding: 42px 12px 14px; gap: 6px;
        background: #161618; border-right: 1px solid var(--panel-border);
      }
      .nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 10px;
        background: transparent; border: none; color: var(--muted);
        font-size: 14px; text-align: left; cursor: pointer; width: 100%;
      }
      .nav-item .ico { display: inline-flex; align-items: center; font-size: 18px; opacity: 0.9; }
      /* SVG アイコン共通: ベースライン隙間を消し、サイズは font-size 継承 (currentColor) */
      .launcher svg.icon, #topbar svg.icon { display: block; }
      /* 画像アイコン (assets/icons の png/jpg 等): 1em の正方形に収める */
      .icon-img { width: 1em; height: 1em; object-fit: contain; display: block; }
      .nav-item:hover { background: #1f1f22; color: var(--fg); }
      .nav-item.active { background: #232327; color: var(--fg); font-weight: 600; }
      .sidebar-spacer { flex: 1; }
      .status-card {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 10px;
        background: #1f1f22; border: 1px solid var(--panel-border); font-size: 13px;
      }
      .status-card .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
      .status-card.connecting .dot { background: #d6a83a; }
      .status-card.connected .dot { background: var(--ok); }
      .status-card.error .dot { background: var(--danger); }
      .status-card .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* コンテンツ領域 */
      .content { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 44px 26px 22px; overflow: hidden; }
      .page { display: none; flex-direction: column; min-height: 0; flex: 1; }
      .page.active { display: flex; }
      .page-head { display: flex; align-items: center; margin-bottom: 16px; }
      .page-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
      .page-head .actions { margin-left: auto; display: flex; gap: 8px; }
      .icon-btn {
        width: 34px; height: 34px; border-radius: 8px;
        background: #232327; border: 1px solid var(--panel-border); color: var(--fg);
        cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
      }
      .icon-btn:hover { background: #2d2d31; }

      /* ホスト一覧 */
      .host-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
      .host-card {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 16px; border-radius: 12px;
        background: var(--panel); border: 1px solid var(--panel-border); cursor: pointer;
      }
      .host-card:hover { border-color: #4a4a4e; background: #202024; }
      .host-card .avatar {
        width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; font-weight: 700; color: #fff;
      }
      .host-card .meta { flex: 1; min-width: 0; }
      .host-card .meta .label { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .host-card .meta .addr { font-size: 12px; color: var(--muted); font-family: monospace; margin-top: 2px; }
      .host-card .card-btn {
        background: transparent; border: none; color: var(--muted);
        cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .host-card .card-btn:hover { background: #2d2d31; color: var(--fg); }
      .host-card .chevron { display: inline-flex; align-items: center; color: var(--muted); font-size: 20px; margin-left: 2px; }
      .empty-hint { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

      /* 設定ページ */
      .settings-body { display: flex; flex-direction: column; gap: 2px; max-width: 480px; }
      .setting-group {
        font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
        margin: 16px 4px 4px; font-weight: 600;
      }
      .setting-group:first-child { margin-top: 0; }
      .color-input {
        width: 42px; height: 28px; padding: 0; border: 1px solid var(--panel-border);
        border-radius: 6px; background: #2c2c2e; cursor: pointer; flex-shrink: 0;
      }
      .num-input {
        width: 80px; flex-shrink: 0; text-align: right;
        background: #2c2c2e; color: var(--fg);
        border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px 8px; font-size: 14px;
      }
      .num-input:focus { outline: none; border-color: var(--accent); }
      /* number 入力の上下スピナーを消す (port などは text+inputmode を使うが念のため) */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      .setting-row {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 4px; border-bottom: 1px solid var(--panel-border);
      }
      .setting-row .s-meta { flex: 1; }
      .setting-row .s-title { font-size: 14px; }
      .setting-row .s-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
      /* トグルスイッチ */
      .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch .slider {
        position: absolute; inset: 0; border-radius: 24px;
        background: #3a3a3e; transition: background 0.15s; cursor: pointer;
      }
      .switch .slider::before {
        content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
        border-radius: 50%; background: #fff; transition: transform 0.15s;
      }
      .switch input:checked + .slider { background: var(--accent); }
      .switch input:checked + .slider::before { transform: translateX(18px); }

      /* ダイアログ (接続 / ホスト編集) */
      #dialog-backdrop {
        position: absolute; inset: 0; z-index: 60;
        display: none; align-items: center; justify-content: center;
        background: rgba(8, 8, 10, 0.6); backdrop-filter: blur(2px);
      }
      #dialog-backdrop.visible { display: flex; }
      .dialog {
        width: 340px; padding: 22px;
        background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        display: flex; flex-direction: column; gap: 12px;
      }
      .dialog h3 { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
      .dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
      .dialog input {
        background: #2c2c2e; color: var(--fg);
        border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; font-size: 14px;
      }
      .dialog input:focus { outline: none; border-color: var(--accent); }
      .dialog .dlg-status { min-height: 14px; font-size: 12px; font-family: monospace; color: var(--muted); }
      .dialog .dlg-status.error { color: #ff8a8d; }
      .dialog .dlg-actions { display: flex; gap: 8px; margin-top: 4px; }
      .dialog .dlg-actions button {
        flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .dialog .btn-primary { background: var(--accent); color: #fff; }
      .dialog .btn-primary:disabled { opacity: 0.6; cursor: default; }
      .dialog .btn-ghost { background: #2c2c2e; color: var(--fg); border: 1px solid var(--panel-border) !important; }
    </style>
  </head>
  <body>
    <!-- 最背面: リモート映像 -->
    <div id="screen-wrap">
      <canvas id="screen" tabindex="0" width="1920" height="1080"></canvas>
    </div>

    <!-- 接続中のオーバーレイ UI (TS が中身を構築) -->
    <div id="topbar-hotzone"></div>
    <div id="topbar"></div>
    <div id="stats-hud"></div>
    <div id="file-panel"></div>
    <div id="toast-container"></div>

    <!-- 未接続時の中央カード (TS が中身を構築) -->
    <div id="connect-overlay"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
