<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDD Remote Desktop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui; overflow: hidden; overscroll-behavior: none; }
      /* ネイティブアプリ感: テキスト選択/コールアウト/ドラッグを無効化。入力欄のみ選択可。 */
      * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
      input, textarea { user-select: text; -webkit-user-select: text; }
      #toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
      #screen-wrap { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      #screen { max-width: 100%; max-height: 100%; background: #000; outline: none; }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="screen-wrap">
      <canvas id="screen" tabindex="0" width="1920" height="1080"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
